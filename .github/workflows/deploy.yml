name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows triggering a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels a queued (not yet running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (test harness only)
        run: pip install -r requirements.txt

      # Fast, deterministic tests only (no browser / external network calls):
      # e2e Puppeteer tests are intentionally not run here so a flaky CDN
      # (Pyodide/Pandoc) can never block a valid deployment.
      - name: Run Python engine tests
        run: npm run test:python

      - name: Run JS unit tests
        run: npm run test:js

      - name: Build production bundle
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
