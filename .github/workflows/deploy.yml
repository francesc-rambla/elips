name: Deploy to /pre (pre-producció)

# Every push to main auto-deploys here first, at
# https://<user>.github.io/<repo>/pre/ — production (the site root) is only
# ever updated by explicitly running the separate "Promote /pre to
# production" workflow once what's here has been validated. See that
# workflow for how the promotion itself works.
on:
  push:
    branches: [main]
  # Allows triggering a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: write

# Only one /pre deployment at a time; a newer push cancels a queued (not yet
# running) one. Kept in its own concurrency group, separate from promote.yml's,
# so a /pre deploy and a production promotion never race each other either.
concurrency:
  group: pages-pre
  cancel-in-progress: false

jobs:
  build-and-deploy-pre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies (test harness only)
        run: pip install -r requirements.txt

      # Fast, deterministic tests only (no browser / external network calls):
      # e2e Puppeteer tests are intentionally not run here so a flaky CDN
      # (Pyodide/Pandoc) can never block a valid deployment.
      - name: Run Python engine tests
        run: npm run test:python

      - name: Run JS unit tests
        run: npm run test:js

      - name: Build production bundle
        run: npx vite build

      # Classic branch-based Pages deploy (not actions/deploy-pages, which
      # only ever manages ONE deployment for the whole site) — this pushes
      # straight to the gh-pages branch under a pre/ subfolder.
      # keep_files: true is essential: without it, this action wipes
      # everything else already on gh-pages (i.e. the production files at
      # the branch root) on every /pre deploy.
      - name: Deploy dist/ to /pre on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pre
          keep_files: true
          commit_message: "Desplega a /pre (pre-producció): ${{ github.sha }}"
